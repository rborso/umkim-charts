{{- if .Values.immich.machineLearning.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ml
  namespace: {{ include "immich.namespace" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: machine-learning
    spec:
      containers:
        - name: immich-machine-learning
          image: {{ .Values.immich.mlImage | quote }}
          imagePullPolicy: {{ .Values.immich.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: TZ
              value: {{ .Values.immich.timezone | quote }}
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ml
  namespace: {{ include "immich.namespace" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
    app.kubernetes.io/component: machine-learning
spec:
  selector:
    app.kubernetes.io/name: immich
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: machine-learning
  ports:
    - name: http
      port: 3003
      targetPort: http
{{- end }}

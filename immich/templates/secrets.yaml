apiVersion: v1
kind: Secret
metadata:
  name: {{ include "immich.secretName" . }}
  namespace: {{ include "immich.namespace" . }}
  labels:
    {{- include "immich.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ include "immich.postgresPassword" . | quote }}
  admin-password: {{ include "immich.adminPassword" . | quote }}
  oauth-client-secret: {{ .Values.bootstrap.oauth.clientSecret | quote }}

{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "servarr.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
      {{- if and (eq $name "jellyfin") $app.ldap.enabled }}
      annotations:
        # Hash the *rendered* LDAP configuration: it is derived from the
        # platform's auth.ldap, so hashing apps.jellyfin.ldap alone left the pod
        # running with a stale file (its init container only renders at start).
        checksum/ldap-config: {{ include (print $.Template.BasePath "/jellyfin-ldap.yaml") $ | sha256sum }}
      {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $persist := ne ($app.persistence | default true) false }}
      {{- $keyInit := and $persist (has $name (list "prowlarr" "sonarr" "radarr" "lidarr")) }}
      {{- $qbtInit := and $persist (eq $name "qbittorrent") $.Values.bootstrap.enabled ($.Values.bootstrap.hooks.qbtPasswordWriter | default true) }}
      {{- $ldapInit := and (eq $name "jellyfin") $app.ldap.enabled }}
      {{- if or $keyInit $qbtInit $ldapInit }}
      initContainers:
        {{- if $keyInit }}
        # Seed config.xml with the chart-owned API key before the app starts, so
        # the bootstrap can reach it without mounting this config volume.
        - name: api-key-init
          image: {{ $.Values.bootstrap.initImage | default "busybox:1.36.1" }}
          imagePullPolicy: IfNotPresent
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-api-keys
                  key: {{ $name }}-api-key
            - name: PUID
              value: {{ $.Values.global.puid | quote }}
            - name: PGID
              value: {{ $.Values.global.pgid | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cfg=/config/config.xml
              if [ -f "${cfg}" ]; then
                if grep -q '<ApiKey>' "${cfg}"; then
                  sed -i "s|<ApiKey>[^<]*</ApiKey>|<ApiKey>${API_KEY}</ApiKey>|" "${cfg}"
                else
                  awk -v k="${API_KEY}" '/<\/Config>/ && !done { print "  <ApiKey>" k "</ApiKey>"; done=1 } { print }' "${cfg}" > "${cfg}.tmp"
                  mv "${cfg}.tmp" "${cfg}"
                fi
              else
                printf '<Config>\n  <ApiKey>%s</ApiKey>\n</Config>\n' "${API_KEY}" > "${cfg}"
              fi
              chown "${PUID:-1000}:${PGID:-1000}" "${cfg}" 2>/dev/null || true
              echo "==> ${cfg} carries the chart API key"
          volumeMounts:
            - name: config
              mountPath: /config
        {{- end }}
        {{- if $qbtInit }}
        # Write the WebUI password from the Secret before qBittorrent starts.
        # This used to be a hook Job that scaled qBittorrent down and back up to
        # touch the volume from another node; as an initContainer it runs on the
        # same node and volume, which is what lets the config volume be
        # ReadWriteOnce.
        - name: qbt-password-init
          image: {{ $.Values.bootstrap.qbtPasswordImage | default "python:3.12-alpine" }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: {{ $.Values.global.puid | quote }}
            - name: PGID
              value: {{ $.Values.global.pgid | quote }}
          envFrom:
            - secretRef:
                name: {{ $.Values.bootstrap.secretName | default (printf "%s-bootstrap" $.Release.Name) }}
                optional: true
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -z "${QBITTORRENT_PASSWORD:-}" ]; then
                echo "no QBITTORRENT_PASSWORD in the bootstrap Secret; leaving the qBittorrent config alone"
                exit 0
              fi
              python3 - <<'PY'
              import base64, hashlib, os
              username = os.environ.get("QBITTORRENT_USERNAME", "admin")
              password = os.environ["QBITTORRENT_PASSWORD"]
              conf_path = "/config/qBittorrent/qBittorrent.conf"
              os.makedirs("/config/qBittorrent", exist_ok=True)
              if not os.path.exists(conf_path):
                  open(conf_path, "w", encoding="utf-8").write("[Preferences]\n")
              with open(conf_path, "r", encoding="utf-8") as handle:
                  lines = handle.read().splitlines()
              filtered = [l for l in lines if not l.startswith("WebUI\\Password_PBKDF2=") and not l.startswith("WebUI\\Username=")]
              salt = os.urandom(16)
              digest = hashlib.pbkdf2_hmac("sha512", password.encode(), salt, 100000, dklen=64)
              hash_value = f"{base64.b64encode(salt).decode()}:{base64.b64encode(digest).decode()}"
              pbkdf2_line = f'WebUI\\Password_PBKDF2="@ByteArray({hash_value})"'
              username_line = f"WebUI\\Username={username}"
              output = []
              inserted = False
              for line in filtered:
                  output.append(line)
                  if line.strip() == "[Preferences]" and not inserted:
                      output.extend([username_line, pbkdf2_line]); inserted = True
              if not inserted:
                  output.extend(["", "[Preferences]", username_line, pbkdf2_line])
              with open(conf_path, "w", encoding="utf-8") as handle:
                  handle.write("\n".join(output) + "\n")
              print(f"updated {conf_path}")
              PY
              chown -R "${PUID:-1000}:${PGID:-1000}" /config/qBittorrent 2>/dev/null || true
          volumeMounts:
            - name: config
              mountPath: /config
        {{- end }}
        {{- if $ldapInit }}
        - name: ldap-auth-init
          image: {{ $app.ldap.initImage | default "busybox:1.36.1" }}
          imagePullPolicy: IfNotPresent
          command: ["/scripts/install-ldap.sh"]
          env:
            - name: LLDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if $app.ldap.existingSecret }}{{ $app.ldap.existingSecret }}{{ else if (($.Values.auth | default dict).ldap | default dict).existingSecret }}{{ (($.Values.auth | default dict).ldap | default dict).existingSecret }}{{ else if $app.ldap.bindPassword }}{{ $.Release.Name }}-jellyfin-ldap-secret{{ else }}{{ $.Release.Name }}-lldap-bind{{ end }}
                  key: {{ $app.ldap.existingSecretKey | default ((( $.Values.auth | default dict).ldap | default dict).existingSecretKey | default "LLDAP_LDAP_USER_PASS") }}
            - name: PUID
              value: {{ $.Values.global.puid | quote }}
            - name: PGID
              value: {{ $.Values.global.pgid | quote }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: ldap-init
              mountPath: /scripts
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ include "servarr.image" (dict "root" $ "app" $app) }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $app.port }}
          env:
            - name: TZ
              value: {{ $.Values.global.timezone | quote }}
            - name: PUID
              value: {{ $.Values.global.puid | quote }}
            - name: PGID
              value: {{ $.Values.global.pgid | quote }}
            {{- range $k, $v := ($app.env | default dict) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            {{- if ne ($app.persistence | default true) false }}
            - name: config
              mountPath: /config
            {{- end }}
            {{- if and $app.media $.Values.media.enabled }}
            - name: media
              mountPath: /media
            {{- end }}
          resources:
            {{- toYaml ($app.resources | default $.Values.resources) | nindent 12 }}
      volumes:
        {{- if ne ($app.persistence | default true) false }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ $name }}-config
        {{- end }}
        {{- if and $app.media $.Values.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-media
        {{- end }}
        {{- if and (eq $name "jellyfin") $app.ldap.enabled }}
        - name: ldap-init
          configMap:
            name: {{ $.Release.Name }}-jellyfin-ldap
            defaultMode: 0755
        {{- end }}
{{- end }}
{{- end }}

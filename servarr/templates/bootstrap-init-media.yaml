{{- if and .Values.bootstrap.enabled .Values.media.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-init-media
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: bootstrap-hook
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "2"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bootstrap-hook
    spec:
      restartPolicy: Never
      containers:
        - name: init-media
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -ec
            - |
              for d in movies tv music downloads; do mkdir -p "/media/$d"; done
              chown -R {{ .Values.global.puid }}:{{ .Values.global.pgid }} /media
              chmod -R 2775 /media
              ls -la /media
          volumeMounts:
            - name: media
              mountPath: /media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-media
{{- end }}

{{- range $name, $app := .Values.apps }}
{{- if $app.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "servarr.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $app.servicePort | default 80 }}
      targetPort: http
    {{- range $app.serviceExtraPorts | default list }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default "http" }}
    {{- end }}
{{- end }}
{{- end }}

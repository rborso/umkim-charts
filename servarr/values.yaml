# Self-contained Servarr stack for UMKIM.
#
# This chart deploys workloads (Deployments), Services, and optional PVCs. It does
# NOT create Ingresses: routing, hostnames, TLS and Authelia are owned by UMKIM via
# FleetApp spec.routes[]. Give each app a route with serviceName/servicePort.

# UMKIM app metadata. Read when the catalog is rendered and used to pre-fill the
# install prompt (not consumed by the chart).
umkim:
  # Tenant each route defaults to. Every directory is created with a
  # `default-tenant` group at deploy time (see the UMKIM LLDAP bootstrap), so it
  # is the one tenant that exists everywhere without an operator declaring one.
  tenant: default-tenant

global:
  # Optional registry prefix for all images (e.g. registry.example.com:5000/umkim-thin).
  imageRegistry: ""
  imagePullSecrets: []
  timezone: Europe/Budapest
  puid: "1000"
  pgid: "1000"

storage:
  # Per-app config volumes (mounted at /config). They hold the apps' SQLite
  # databases, so they need a POSIX filesystem with reliable locking: use
  # ReadWriteOnce on a block-backed class (Longhorn). SQLite over NFS — which is
  # what an RWX class such as Longhorn's share-manager is — logs
  # "database is locked" and stalls the *arr API.
  #
  # Only the owning app and its own initContainers mount these, so RWO is safe.
  # The bootstrap used to mount every config volume and no longer does (it gets
  # the *arr API keys from a Secret instead), which is what allowed RWO here.
  config:
    # Empty uses the cluster default StorageClass.
    storageClass: longhorn
    accessMode: ReadWriteOnce
  # Shared media volume (mounted at /media). Several apps mount it at once and it
  # is plain files, so ReadWriteMany on a shared class (NFS) is correct.
  media:
    # Empty uses the cluster default StorageClass.
    storageClass: nfs-client
    accessMode: ReadWriteMany

# Shared media volume mounted at /media in the *arr + Jellyfin apps.
media:
  enabled: true
  size: 50Gi

# Common pod settings applied to every app unless overridden per app.
resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { memory: 2Gi }

# Optional post-install Job that configures the stack through the app APIs.
bootstrap:
  enabled: false
  # Image built from the repo's bootstrap/ (Node + Playwright), e.g.
  # registry.example.com:5000/umkim-thin/servarr-bootstrap:0.8
  image: ""
  # The console imports the image into the pinned node's containerd, so it runs
  # with Never (no registry). Standalone users can keep IfNotPresent.
  imagePullPolicy: IfNotPresent
  # Pin the Job to the node that has the image (the console sets this on HA).
  nodeSelector: {}
  # Secret with the app credentials; defaults to <release>-bootstrap.
  secretName: ""
  mediaLanguage: en
  qualityCutoff: 720p
  # Auto-approve requests from directory users so they do not get stuck pending.
  seerrAutoApprove: true
  # Jellyfin library scan interval in minutes (default Jellyfin is 12 hours).
  jellyfinLibraryScanMinutes: 15
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  # Images for the per-app initContainers: one seeds config.xml with the
  # chart-owned API key, one writes the qBittorrent WebUI password. Both run in
  # the app's own pod, on its own node and volume, so no hook Job has to mount a
  # config volume and those volumes can be ReadWriteOnce.
  initImage: busybox:1.36.1
  qbtPasswordImage: python:3.12-alpine
  hooks:
    # Write the qBittorrent WebUI password from the Secret before qBittorrent
    # starts.
    qbtPasswordWriter: true

# One entry per application. Add or disable apps here.
# The default stack is Seerr (requests) + Jellyfin (playback) plus the acquisition
# pipeline they need: Sonarr/Radarr (fulfil requests), Prowlarr (indexers),
# FlareSolverr (indexer proxy) and qBittorrent (download client).
#   port        container port (linuxserver images listen on their app port)
#   servicePort Service port exposed to UMKIM routes
#   media       mount the shared /media volume
#   persistence false for stateless apps (no config PVC)
apps:
  sonarr:
    enabled: true
    image: lscr.io/linuxserver/sonarr
    tag: "4.0.20.3014-ls2"
    port: 8989
    servicePort: 80
    configSize: 1Gi
    media: true
  radarr:
    enabled: true
    image: lscr.io/linuxserver/radarr
    tag: "6.4.4.10685-ls325"
    port: 7878
    servicePort: 80
    configSize: 1Gi
    media: true
  prowlarr:
    enabled: true
    image: lscr.io/linuxserver/prowlarr
    tag: "2.7.0.5723-ls166"
    port: 9696
    servicePort: 80
    configSize: 1Gi
  flaresolverr:
    enabled: true
    image: ghcr.io/flaresolverr/flaresolverr
    tag: "v3.5.2"
    port: 8191
    servicePort: 80
    persistence: false
    resources:
      requests: { memory: 512Mi }
      limits: { memory: 2Gi }
  qbittorrent:
    enabled: true
    image: lscr.io/linuxserver/qbittorrent
    tag: "5.3.0"
    port: 8080
    servicePort: 80
    # The bootstrap's Prowlarr download-client hardcodes port 8080, so expose it too.
    serviceExtraPorts:
      - { name: web, port: 8080 }
    configSize: 5Gi
    media: true
  jellyfin:
    enabled: true
    image: lscr.io/linuxserver/jellyfin
    # 12.x keeps the /Startup first-run API the bootstrap drives; the wizard
    # endpoints are marked obsolete but still present in 12.4.
    tag: "12.4ubu2604-ls57"
    port: 8096
    servicePort: 80
    # Seerr's Jellyfin auth falls back to the container port (8096) because the
    # bootstrap URL uses :80, which Node's URL normalises away. Expose it too.
    serviceExtraPorts:
      - { name: web, port: 8096 }
    # Jellyfin 12 refuses to start when /config/data/data has less than 2 GiB
    # free; a 2 GiB volume shows ~1.9 GiB after filesystem overhead.
    configSize: 3Gi
    media: true
    # LDAP authentication for Jellyfin via the official jellyfin-plugin-ldapauth,
    # on by default: a cluster that runs its own LLDAP should let the same
    # directory users in without an operator opting in. Seerr authenticates
    # through Jellyfin, so this is also what lets directory users use Seerr.
    # Point it elsewhere, or turn it off, for a standalone deployment.
    ldap:
      enabled: true
      # jellyfin-plugin-ldapauth build matching this Jellyfin ABI:
      #   Jellyfin 10.10.x -> plugin v20 (targetAbi 10.10.6.0)
      #   Jellyfin 10.11.x -> plugin v21 (targetAbi 10.11.0.0)
      #   Jellyfin 12.x   -> plugin v24 (targetAbi 12.0.0.0)
      pluginVersion: "24.0.0.0"
      pluginUrl: "https://github.com/jellyfin/jellyfin-plugin-ldapauth/releases/download/v24/ldap-authentication_24.0.0.0.zip"
      initImage: "busybox:1.36.1"
      # Empty means "take it from the platform's auth.ldap" (UMKIM sets host,
      # port, bindDn, userSearchBase and the bind Secret there). Override for a
      # standalone deployment; the old defaults pointed at a different
      # installation's LLDAP and left Jellyfin unable to bind.
      server: ""
      port: 0
      useSsl: false
      startTls: false
      bindUser: ""
      # Inline bind password (the chart creates a Secret) ...
      bindPassword: ""
      # ... or reference an existing Secret in this namespace (preferred).
      # Empty means "<release>-lldap-bind", the name UMKIM installs.
      existingSecret: ""
      existingSecretKey: "LLDAP_LDAP_USER_PASS"
      baseDn: ""
      searchFilter: "(&(objectClass=person)(uid={username}))"
      searchAttributes: "uid, cn, mail, displayName"
      uidAttribute: "uid"
      usernameAttribute: "uid"
      adminFilter: "_disabled_"
      createUsers: true
      allowPasswordChange: false
      enableAllFolders: true
  seerr:
    enabled: true
    image: ghcr.io/seerr-team/seerr
    tag: "v3.5.1"
    port: 5055
    servicePort: 80
    configSize: 1Gi
    env:
      # Seerr defaults to /app/config; this chart mounts the config PVC at
      # /config. Without this it keeps its database/settings in the container
      # layer (and Seerr shows its "volume mount was not configured" banner).
      CONFIG_DIRECTORY: /config
  # Not shipped by this chart, but the bootstrap image enables every component by
  # default and the generated ConfigMap only states the flags for the apps listed
  # here — so a missing entry means "on", and the bootstrap waits for a Lidarr
  # Service that never appears. Keep it listed and disabled.
  lidarr:
    enabled: false

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperless.secretName" . }}
  namespace: {{ include "paperless.namespace" . }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret-key: {{ include "paperless.secretKey" . | quote }}
  admin-password: {{ include "paperless.adminPassword" . | quote }}
  postgres-password: {{ include "paperless.postgresPassword" . | quote }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}

{{- $ns := include "paperless.namespace" . }}
{{- $secret := include "paperless.secretName" . }}
{{- $oidcProviders := dict "openid_connect" (dict "APPS" (list (dict "provider_id" .Values.oidc.providerId "name" .Values.oidc.providerName "client_id" .Values.oidc.clientId "secret" .Values.oidc.clientSecret "settings" (dict "server_url" .Values.oidc.issuerUrl "token_auth_method" (.Values.oidc.tokenAuthMethod | default "client_secret_basic"))))) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ $ns }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-media
  namespace: {{ $ns }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.media.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.media.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-consume
  namespace: {{ $ns }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.consume.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.consume.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-export
  namespace: {{ $ns }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.export.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.export.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless.host" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
      annotations:
        checksum/umkim-thin-ca: {{ include "paperless.caChecksum" . | quote }}
    spec:
{{- $hostAliases := include "paperless.hostAliases" . -}}
{{- if trim $hostAliases }}
      hostAliases:
        {{- $hostAliases | nindent 8 }}
{{- end }}
      {{- if .Values.oidc.enabled }}
      initContainers:
        - name: ca-bundle
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/sh", "-ec", "if [ -f /etc/ssl/umkim-thin/ca.crt ]; then cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/umkim-thin/ca.crt > /etc/ssl/combined/ca.crt; else cp /etc/ssl/certs/ca-certificates.crt /etc/ssl/combined/ca.crt; fi"]
          volumeMounts:
            - name: umkim-thin-ca
              mountPath: /etc/ssl/umkim-thin
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined
      {{- end }}
      containers:
        - name: paperless
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: PAPERLESS_REDIS
              value: "redis://{{ .Release.Name }}-redis:6379"
            - name: PAPERLESS_DBENGINE
              value: "postgresql"
            - name: PAPERLESS_DBHOST
              value: {{ .Release.Name }}-postgres
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: {{ .Values.postgres.database | quote }}
            - name: PAPERLESS_DBUSER
              value: {{ .Values.postgres.username | quote }}
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: postgres-password
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: secret-key
            - name: PAPERLESS_ADMIN_USER
              value: {{ .Values.admin.user | quote }}
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: admin-password
            - name: PAPERLESS_ADMIN_MAIL
              value: {{ .Values.admin.mail | quote }}
            - name: PAPERLESS_TIME_ZONE
              value: {{ .Values.timezone | quote }}
            - name: PAPERLESS_OCR_LANGUAGE
              value: {{ .Values.ocrLanguage | quote }}
            {{- with .Values.ocrLanguages }}
            - name: PAPERLESS_OCR_LANGUAGES
              value: {{ . | quote }}
            {{- end }}
            - name: PAPERLESS_ALLOWED_HOSTS
              value: {{ .Values.allowedHosts | quote }}
            {{- if .Values.externalUrl }}
            - name: PAPERLESS_URL
              value: {{ .Values.externalUrl | quote }}
            - name: PAPERLESS_CSRF_TRUSTED_ORIGINS
              value: {{ .Values.externalUrl | quote }}
            {{- end }}
            {{- if .Values.oidc.enabled }}
            - name: PAPERLESS_APPS
              value: "allauth.socialaccount.providers.openid_connect"
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              value: {{ $oidcProviders | toJson | quote }}
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: {{ .Values.oidc.autoSignup | quote }}
            - name: PAPERLESS_SOCIAL_ACCOUNT_DEFAULT_GROUPS
              value: {{ join "," .Values.oidc.defaultGroups | quote }}
            - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
              value: {{ .Values.oidc.redirectLoginToSso | quote }}
            # Python's requests (django-allauth) fetches the discovery
            # document, token and JWKS from the issuer. Use a bundle that
            # always exists: the image's public roots, plus the platform CA
            # when one is published.
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/combined/ca.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/combined/ca.crt
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /accounts/login/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: export
              mountPath: /usr/src/paperless/export
            {{- if .Values.oidc.enabled }}
            - name: combined-ca
              mountPath: /etc/ssl/combined
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-media
        - name: consume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-consume
        - name: export
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-export
        {{- if .Values.oidc.enabled }}
        - name: umkim-thin-ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paperless.host" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: paperless
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8000
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mealie
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: ca-bundle
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -f /etc/ssl/umkim-thin/ca.crt ]; then
                cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/umkim-thin/ca.crt > /etc/ssl/combined/ca.crt
              else
                cp /etc/ssl/certs/ca-certificates.crt /etc/ssl/combined/ca.crt
              fi
          volumeMounts:
            - { name: ca, mountPath: /etc/ssl/umkim-thin, readOnly: true }
            - { name: combined-ca, mountPath: /etc/ssl/combined }
      containers:
        - name: mealie
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - { name: http, containerPort: 9000 }
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
            - name: BASE_URL
              value: {{ .Values.externalUrl | quote }}
            - name: HOST_IP
              value: {{ .Values.hostIP | quote }}
            - name: DB_ENGINE
              value: "postgres"
            - name: POSTGRES_SERVER
              value: {{ printf "%s-postgres" .Release.Name | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: postgres-password
            - name: DEFAULT_EMAIL
              value: {{ .Values.bootstrap.adminEmail | quote }}
            - name: DEFAULT_GROUP
              value: "Home"
            - name: DEFAULT_HOUSEHOLD
              value: "Family"
            - name: ALLOW_SIGNUP
              value: {{ .Values.allowSignup | quote }}
            - name: ALLOW_PASSWORD_LOGIN
              value: {{ .Values.allowPasswordLogin | quote }}
            - name: API_DOCS
              value: {{ .Values.apiDocs | quote }}
            - name: OIDC_AUTH_ENABLED
              value: {{ .Values.oidc.enabled | quote }}
            - name: OIDC_CONFIGURATION_URL
              value: {{ printf "%s/.well-known/openid-configuration" (trimSuffix "/" .Values.oidc.issuerUrl) | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: oidc-client-secret
            - name: OIDC_PROVIDER_NAME
              value: {{ .Values.oidc.providerName | quote }}
            - name: OIDC_SIGNUP_ENABLED
              value: {{ .Values.oidc.signupEnabled | quote }}
            - name: OIDC_AUTO_REDIRECT
              value: {{ .Values.oidc.autoRedirect | quote }}
            - name: OIDC_REQUIRES_EMAIL_VERIFICATION
              value: {{ .Values.oidc.requireEmailVerification | quote }}
            - name: OIDC_TLS_CACERTFILE
              value: "/etc/ssl/combined/ca.crt"
            {{- with .Values.oidc.userGroup }}
            - name: OIDC_USER_GROUP
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.adminGroup }}
            - name: OIDC_ADMIN_GROUP
              value: {{ . | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/app/about/startup-info
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: combined-ca, mountPath: /etc/ssl/combined, readOnly: true }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}

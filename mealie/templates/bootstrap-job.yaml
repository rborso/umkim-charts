{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mealie-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ .Values.bootstrap.hookDeletePolicy }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache curl jq >/dev/null 2>&1
              BASE="http://{{ .Release.Name }}:9000"
              echo "==> waiting for Mealie"
              for i in $(seq 1 120); do
                if curl -fsS "${BASE}/api/app/about/startup-info" >/dev/null 2>&1; then break; fi
                sleep 5
              done
              curl -fsS "${BASE}/api/app/about/startup-info" >/dev/null

              login() {
                email="$1"; pass="$2"; out="$3"
                code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "${BASE}/api/auth/token" \
                  -H 'Content-Type: application/x-www-form-urlencoded' \
                  --data-urlencode "username=${email}" --data-urlencode "password=${pass}") || true
                [ "$code" = 200 ] || return 1
                jq -e -r '.access_token // empty' "$out" >/dev/null 2>&1
              }

              # Mealie keeps its seeded `changeme@example.com` account even
              # when DEFAULT_EMAIL is set, so try both account names.
              login_any() {
                pass="$1"; out="$2"
                for email in "${ADMIN_EMAIL}" "changeme@example.com"; do
                  if login "$email" "$pass" "$out"; then
                    LOGIN_EMAIL="$email"
                    return 0
                  fi
                done
                return 1
              }

              # A rerun after the first bootstrap must not fail: the generated
              # admin password is already the current one.
              if login_any "${ADMIN_PASSWORD}" /tmp/new-login.json; then
                echo "admin password already rotated (${LOGIN_EMAIL})"
                exit 0
              fi

              if ! login_any "${INITIAL_PASSWORD}" /tmp/initial-login.json; then
                echo "could not authenticate with the initial Mealie admin" >&2
                exit 1
              fi
              EMAIL="${LOGIN_EMAIL}"
              TOKEN=$(jq -r '.access_token' /tmp/initial-login.json)
              BODY=$(jq -n --arg current "${INITIAL_PASSWORD}" --arg new "${ADMIN_PASSWORD}" \
                '{currentPassword:$current,newPassword:$new}')
              code=$(curl -sS -o /tmp/change.json -w '%{http_code}' -X PUT "${BASE}/api/users/password" \
                -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
                -d "$BODY") || true
              [ "$code" = 200 ] || { echo "password change failed (HTTP ${code})" >&2; cat /tmp/change.json >&2; exit 1; }

              login "${EMAIL}" "${ADMIN_PASSWORD}" /tmp/new-login.json || {
                echo "admin password verification failed" >&2
                exit 1
              }
              echo "Mealie admin password rotated (${EMAIL})"
          env:
            - name: ADMIN_EMAIL
              value: {{ .Values.bootstrap.adminEmail | quote }}
            - name: INITIAL_PASSWORD
              value: {{ .Values.bootstrap.initialPassword | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: admin-password
{{- end }}

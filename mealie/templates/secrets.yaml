{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pg := .Values.postgres.password -}}
{{- if and (not $pg) $existing (index ($existing.data | default dict) "postgres-password") -}}
{{- $pg = index $existing.data "postgres-password" | b64dec -}}
{{- end -}}
{{- if not $pg -}}{{- $pg = randAlphaNum 32 -}}{{- end -}}
{{- $admin := .Values.bootstrap.adminPassword -}}
{{- if and (not $admin) $existing (index ($existing.data | default dict) "admin-password") -}}
{{- $admin = index $existing.data "admin-password" | b64dec -}}
{{- end -}}
{{- if not $admin -}}{{- $admin = randAlphaNum 24 -}}{{- end -}}
{{- $oidc := .Values.oidc.clientSecret -}}
{{- if and (not $oidc) $existing (index ($existing.data | default dict) "oidc-client-secret") -}}
{{- $oidc = index $existing.data "oidc-client-secret" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  postgres-password: {{ $pg | quote }}
  admin-password: {{ $admin | quote }}
  oidc-client-secret: {{ $oidc | quote }}

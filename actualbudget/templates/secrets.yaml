{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingData := ($existing).data | default dict -}}
{{- $oidc := .Values.oidc.clientSecret -}}
{{- if and (not $oidc) (index $existingData "oidc-client-secret") -}}
{{- $oidc = index $existingData "oidc-client-secret" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: actualbudget
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  oidc-client-secret: {{ $oidc | quote }}

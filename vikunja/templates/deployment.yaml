apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  # The data PVC is ReadWriteOnce: a rolling update would schedule the new pod
  # before the old one releases the volume and it would hang in
  # FailedAttachVolume until the upgrade deadline.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Restart the pod when the generated config changes (an OIDC client
        # rotation must not require a manual rollout).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The app crash-looped on a fresh install: it started before Postgres was
      # accepting connections and exited on "Could not connect to db". It recovers
      # on restart, but a fresh install should not need to crash first.
      #
      # Vikunja's image is FROM scratch: no shell, and only the CA bundle it
      # ships. Both init containers therefore borrow a shell from the same alpine
      # helper image. The CA one gives the app the platform CA so OIDC discovery
      # and the token exchange trust the issuer when the lab CA is the only
      # trust anchor.
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.bootstrap.probeImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              i=0
              while [ "$i" -lt 60 ]; do
                if nc -z {{ .Release.Name }}-postgres 5432 2>/dev/null; then exit 0; fi
                i=$((i+1)); sleep 2
              done
              echo "postgres did not answer within 120s" >&2
              exit 1
        - name: ca-bundle
          image: {{ .Values.bootstrap.probeImage | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ -f /etc/ssl/umkim-thin/ca.crt ]; then
                cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/umkim-thin/ca.crt > /etc/ssl/combined/ca.crt
              else
                cp /etc/ssl/certs/ca-certificates.crt /etc/ssl/combined/ca.crt
              fi
          volumeMounts:
            - { name: ca, mountPath: /etc/ssl/umkim-thin, readOnly: true }
            - { name: combined-ca, mountPath: /etc/ssl/combined }
      containers:
        - name: vikunja
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - { name: http, containerPort: 3456 }
          env:
            - name: VIKUNJA_SERVICE_ROOTPATH
              value: /app/vikunja/
            - name: TZ
              value: {{ .Values.timezone | quote }}
            # Postgres secrets come from the Secret, never the ConfigMap.
            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: postgres-password
            {{- if .Values.oidc.enabled }}
            # Only the client secret uses the .file indirection; the rest of the
            # provider comes from config.yml. Verified in a container: without
            # this env the app logs "required key 'clientsecret' is missing" and
            # drops the provider.
            - name: VIKUNJA_AUTH_OPENID_PROVIDERS_{{ upper .Values.oidc.providerKey }}_CLIENTSECRET_FILE
              value: /etc/vikunja-oidc/client-secret
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            # /health is the unauthenticated healthcheck route; /api/v1/info
            # would also work but this is the documented one.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /app/vikunja/files }
            - { name: config, mountPath: /etc/vikunja, readOnly: true }
            - { name: combined-ca, mountPath: /etc/ssl/combined, readOnly: true }
            {{- if .Values.oidc.enabled }}
            - { name: oidc-secret, mountPath: /etc/vikunja-oidc, readOnly: true }
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
        {{- if .Values.oidc.enabled }}
        - name: oidc-secret
          secret:
            secretName: {{ .Release.Name }}-secrets
            items:
              - key: oidc-client-secret
                path: client-secret
        {{- end }}

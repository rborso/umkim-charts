apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ include "nextcloud.namespace" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.nextcloud.persistence.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.nextcloud.persistence.data.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud.serverHost" . }}
  namespace: {{ include "nextcloud.namespace" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
    spec:
{{- $hostAliases := include "nextcloud.hostAliases" . -}}
{{- if trim $hostAliases }}
      hostAliases:
        {{- $hostAliases | nindent 8 }}
{{- end }}
      containers:
        - name: nextcloud
          image: {{ .Values.nextcloud.image | quote }}
          imagePullPolicy: {{ .Values.nextcloud.imagePullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.nextcloud.timezone | quote }}
            - name: POSTGRES_HOST
              value: {{ printf "%s-postgres" .Release.Name | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud.secretName" . }}
                  key: postgres-password
            - name: NEXTCLOUD_ADMIN_USER
              value: {{ .Values.bootstrap.admin.username | quote }}
            - name: NEXTCLOUD_ADMIN_EMAIL
              value: {{ include "nextcloud.adminEmail" . | quote }}
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud.secretName" . }}
                  key: admin-password
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: {{ join " " (append .Values.nextcloud.trustedDomains (include "nextcloud.publicHost" .)) | quote }}
            - name: TRUSTED_PROXIES
              value: {{ .Values.nextcloud.trustedProxies | quote }}
            - name: OVERWRITEPROTOCOL
              value: {{ (urlParse (include "nextcloud.externalUrl" .)).scheme | quote }}
            - name: OVERWRITECLIURL
              value: {{ include "nextcloud.externalUrl" . | quote }}
            {{- if .Values.redis.enabled }}
            - name: REDIS_HOST
              value: {{ printf "%s-redis" .Release.Name | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            {{- if .Values.oidc.enabled }}
            - name: combined-ca
              mountPath: /etc/ssl/combined
            - name: php-ca
              mountPath: /usr/local/etc/php/conf.d/zz-umkim-ca.ini
              subPath: zz-umkim-ca.ini
              readOnly: true
            {{- end }}
          readinessProbe:
            # TCP only: the HTTP status endpoint checks Host against
            # trusted_domains, and the probe reaches the pod by IP. The public
            # host is the only trusted domain; the app's own bootstrap gates
            # the rest of the readiness work.
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          resources:
            {{- toYaml .Values.nextcloud.resources | nindent 12 }}
      {{- if .Values.oidc.enabled }}
      initContainers:
        - name: ca-bundle
          image: {{ .Values.nextcloud.image | quote }}
          imagePullPolicy: {{ .Values.nextcloud.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - if [ -f /etc/ssl/umkim-thin/ca.crt ]; then cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/umkim-thin/ca.crt > /etc/ssl/combined/ca.crt; else cp /etc/ssl/certs/ca-certificates.crt /etc/ssl/combined/ca.crt; fi
          volumeMounts:
            - name: umkim-thin-ca
              mountPath: /etc/ssl/umkim-thin
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if .Values.oidc.enabled }}
        - name: umkim-thin-ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
        - name: php-ca
          configMap:
            name: {{ .Release.Name }}-php-ca
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud.serverHost" . }}
  namespace: {{ include "nextcloud.namespace" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 80
      targetPort: http

{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  namespace: {{ include "nextcloud.namespace" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ .Values.bootstrap.hookDeletePolicy }}
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bootstrap
    spec:
      # Co-locate with the server pod, which holds the shared ReadWriteOnce data
      # volume (no PV node affinity on backends like Longhorn).
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nextcloud
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/component: server
              topologyKey: kubernetes.io/hostname
      {{- $hostAliases := include "nextcloud.hostAliases" . }}
      {{- if trim $hostAliases }}
      hostAliases:
        {{- $hostAliases | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | default .Values.nextcloud.image | quote }}
          imagePullPolicy: {{ .Values.nextcloud.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              occ() { runuser -u www-data -- php /var/www/html/occ "$@"; }

              echo "==> waiting for Nextcloud"
              ok=""
              for i in $(seq 1 180); do
                if occ status --output=json 2>/dev/null | grep -q '"installed":true'; then ok=1; break; fi
                sleep 5
              done
              [ -n "${ok}" ] || { echo "Nextcloud did not finish installing" >&2; exit 1; }

              echo "==> trusted domains and overwrite url (${PUBLIC_HOST})"
              # Replace the whole array: a previous install may have left a
              # wildcard or the pod IP at index 1, and setting only index 0 would
              # keep it.
              occ config:system:set trusted_domains --type=json --value="[\"${PUBLIC_HOST}\"]"
              occ config:system:set overwritehost --value="${PUBLIC_HOST}"
              occ config:system:set overwrite.cli.url --value="${EXTERNAL_URL}"
              occ config:system:set overwriteprotocol --value="${PROTOCOL}"

              echo "==> default language (${DEFAULT_LANGUAGE})"
              occ config:system:set default_language --value="${DEFAULT_LANGUAGE}"
              occ user:setting "${ADMIN_USERNAME}" core lang "${DEFAULT_LANGUAGE}" || \
                echo "WARN: could not set the admin language"

              if [ "${LDAP_ENABLED:-false}" = "true" ]; then
                echo "==> directory (LDAP ${LDAP_HOST}:${LDAP_PORT})"
                occ app:enable user_ldap
                if ! occ ldap:show-config s01 >/dev/null 2>&1; then
                  occ ldap:create-empty-config
                fi
                occ ldap:set-config s01 ldapHost "${LDAP_HOST}"
                occ ldap:set-config s01 ldapPort "${LDAP_PORT}"
                occ ldap:set-config s01 ldapAgentName "${LDAP_BIND_DN}"
                occ ldap:set-config s01 ldapAgentPassword "${LDAP_BIND_PASSWORD}"
                occ ldap:set-config s01 ldapBase "${LDAP_BASE_DN}"
                occ ldap:set-config s01 ldapBaseUsers "${LDAP_BASE_DN}"
                occ ldap:set-config s01 ldapBaseGroups "${LDAP_GROUP_BASE_DN}"
                occ ldap:set-config s01 ldapUserFilter "${LDAP_USER_FILTER}"
                occ ldap:set-config s01 ldapLoginFilter "${LDAP_LOGIN_FILTER}"
                occ ldap:set-config s01 ldapUserDisplayName "${LDAP_DISPLAY_NAME_ATTR}"
                occ ldap:set-config s01 ldapExpertUsernameAttr "${LDAP_USERNAME_ATTR}"
                occ ldap:set-config s01 ldapEmailAttribute "${LDAP_EMAIL_ATTR}"
                occ ldap:set-config s01 ldapGroupFilter "${LDAP_GROUP_FILTER}"
                occ ldap:set-config s01 ldapConfigurationActive 1
                occ ldap:test-config s01 || echo "WARN: ldap:test-config reported an issue"
              else
                echo "==> directory skipped (disabled)"
              fi

              if [ "${OIDC_ENABLED:-false}" = "true" ]; then
                echo "==> OIDC provider ${OIDC_PROVIDER_ID} -> ${OIDC_ISSUER}"
                # Nextcloud's HTTP client verifies against its own
                # resources/config/ca-bundle.crt (not php.ini), so the platform
                # CA must be in that file for the discovery/token/JWKS calls.
                if [ -w /var/www/html/resources/config/ca-bundle.crt ] && \
                   [ -f /etc/ssl/umkim-thin/ca.crt ] && \
                   ! grep -q 'umkim-thin platform CA' /var/www/html/resources/config/ca-bundle.crt; then
                  printf '\n# umkim-thin platform CA\n' >> /var/www/html/resources/config/ca-bundle.crt
                  cat /etc/ssl/umkim-thin/ca.crt >> /var/www/html/resources/config/ca-bundle.crt
                fi
                # user_oidc is an official app but not baked into every image;
                # the store download uses the combined CA bundle.
                occ app:enable user_oidc >/dev/null 2>&1 || occ app:install user_oidc >/dev/null 2>&1 || true
                occ app:enable user_oidc >/dev/null 2>&1 || true
                occ user_oidc:provider "${OIDC_PROVIDER_ID}" \
                  --clientid="${OIDC_CLIENT_ID}" --clientsecret="${OIDC_CLIENT_SECRET}" \
                  --discoveryuri="${OIDC_ISSUER}/.well-known/openid-configuration" \
                  --scope="${OIDC_SCOPES}" \
                  --mapping-uid="${OIDC_MAPPING_UID}" \
                  --mapping-email="${OIDC_MAPPING_EMAIL}" \
                  --mapping-display-name="${OIDC_MAPPING_DISPLAY_NAME}" \
                  || echo "WARN: user_oidc provider setup failed"
              else
                echo "==> OIDC skipped (disabled)"
              fi

              if [ "${COLLABORA_ENABLED:-false}" = "true" ]; then
                echo "==> Collabora (server ${COLLABORA_INTERNAL_URL}, browser ${COLLABORA_URL})"
                occ app:enable richdocuments
                # wopi_url is fetched by this server (WOPI discovery), so it must
                # be the in-cluster Service. public_wopi_url is what the browser
                # loads the editor from, so it stays the public host.
                occ config:app:set richdocuments wopi_url --value="${COLLABORA_INTERNAL_URL}"
                occ config:app:set richdocuments public_wopi_url --value="${COLLABORA_URL}"
                occ config:app:set richdocuments disable_certificate_verification --value=no
                # New documents are OOXML (.docx/.xlsx/.pptx) rather than ODF. This is
                # the app default; set it so the choice is explicit.
                occ config:app:set richdocuments doc_format --value=ooxml
                occ richdocuments:activate-config || true
              else
                echo "==> Collabora skipped (disabled)"
              fi

              echo "==> bootstrap complete"
          env:
            - name: TZ
              value: {{ .Values.nextcloud.timezone | quote }}
            - name: PUBLIC_HOST
              value: {{ include "nextcloud.publicHost" . | quote }}
            - name: EXTERNAL_URL
              value: {{ include "nextcloud.externalUrl" . | quote }}
            - name: PROTOCOL
              value: {{ (urlParse (include "nextcloud.externalUrl" .)).scheme | quote }}
            - name: DEFAULT_LANGUAGE
              value: {{ .Values.bootstrap.language | default "en" | quote }}
            - name: ADMIN_USERNAME
              value: {{ .Values.bootstrap.admin.username | quote }}
            - name: LDAP_ENABLED
              value: {{ .Values.auth.ldap.enabled | quote }}
            - name: LDAP_HOST
              value: {{ .Values.auth.ldap.host | quote }}
            - name: LDAP_PORT
              value: {{ .Values.auth.ldap.port | quote }}
            - name: LDAP_BIND_DN
              value: {{ .Values.auth.ldap.bindDn | quote }}
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud.ldapSecretName" . }}
                  key: {{ include "nextcloud.ldapSecretKey" . }}
                  # Absent when LDAP is disabled; the script only reads it when
                  # LDAP_ENABLED=true, so do not block the Job on a missing key.
                  optional: true
            - name: LDAP_BASE_DN
              value: {{ .Values.auth.ldap.baseDn | quote }}
            - name: LDAP_GROUP_BASE_DN
              value: {{ .Values.auth.ldap.groupBaseDn | default "ou=groups,dc=example,dc=com" | quote }}
            - name: LDAP_USER_FILTER
              value: {{ .Values.auth.ldap.userFilter | quote }}
            - name: LDAP_LOGIN_FILTER
              value: {{ .Values.auth.ldap.loginFilter | quote }}
            - name: LDAP_DISPLAY_NAME_ATTR
              value: {{ .Values.auth.ldap.displayNameAttribute | quote }}
            - name: LDAP_USERNAME_ATTR
              value: {{ .Values.auth.ldap.usernameAttribute | quote }}
            - name: LDAP_EMAIL_ATTR
              value: {{ .Values.auth.ldap.emailAttribute | quote }}
            - name: LDAP_GROUP_FILTER
              value: {{ .Values.auth.ldap.groupFilter | default "(&(objectClass=groupOfNames))" | quote }}
            - name: OIDC_ENABLED
              value: {{ .Values.oidc.enabled | quote }}
            - name: OIDC_PROVIDER_ID
              value: {{ .Values.oidc.providerId | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              value: {{ .Values.oidc.clientSecret | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.oidc.issuerUrl | quote }}
            - name: OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            - name: OIDC_MAPPING_UID
              value: {{ .Values.oidc.mappingUid | quote }}
            - name: OIDC_MAPPING_EMAIL
              value: {{ .Values.oidc.mappingEmail | quote }}
            - name: OIDC_MAPPING_DISPLAY_NAME
              value: {{ .Values.oidc.mappingDisplayName | quote }}
            - name: COLLABORA_ENABLED
              value: {{ .Values.collabora.enabled | quote }}
            - name: COLLABORA_URL
              value: {{ include "nextcloud.collaboraWopiUrl" . | quote }}
            - name: COLLABORA_INTERNAL_URL
              value: {{ include "nextcloud.collaboraInternalUrl" . | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            {{- if .Values.oidc.enabled }}
            - name: umkim-thin-ca
              mountPath: /etc/ssl/umkim-thin
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined
            - name: php-ca
              mountPath: /usr/local/etc/php/conf.d/zz-umkim-ca.ini
              subPath: zz-umkim-ca.ini
              readOnly: true
            {{- end }}
      {{- if .Values.oidc.enabled }}
      initContainers:
        # The platform bundle carries the lab CA and the staging roots; the
        # image's system bundle carries the public roots. Combine them so the
        # app store (user_oidc) and the portal discovery both verify.
        - name: ca-bundle
          image: {{ .Values.nextcloud.image | quote }}
          imagePullPolicy: {{ .Values.nextcloud.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - if [ -f /etc/ssl/umkim-thin/ca.crt ]; then cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/umkim-thin/ca.crt > /etc/ssl/combined/ca.crt; else cp /etc/ssl/certs/ca-certificates.crt /etc/ssl/combined/ca.crt; fi
          volumeMounts:
            - name: umkim-thin-ca
              mountPath: /etc/ssl/umkim-thin
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if .Values.oidc.enabled }}
        - name: umkim-thin-ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
        - name: php-ca
          configMap:
            name: {{ .Release.Name }}-php-ca
        {{- end }}
{{- end }}

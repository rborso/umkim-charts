{{- if .Values.collabora.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud.collaboraHost" . }}
  namespace: {{ include "nextcloud.namespace" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: collabora
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: collabora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: collabora
    spec:
      {{- $hostAliases := include "nextcloud.hostAliases" . }}
      {{- if trim $hostAliases }}
      hostAliases:
        {{- $hostAliases | nindent 8 }}
      {{- end }}
      containers:
        - name: collabora
          image: {{ .Values.collabora.image | quote }}
          imagePullPolicy: {{ .Values.collabora.imagePullPolicy }}
          env:
            - name: aliasgroup1
              value: {{ include "nextcloud.collaboraAliasGroup" . | quote }}
            # TLS is terminated by the fleet ingress in front of Collabora.
            # net.post_allow.host whitelists the public hostname: without it
            # Collabora answers 403 "Rejected request from RFC1918 IP to public
            # server address" (the ingress reaches it from a private address).
            - name: extra_params
              value: >-
                --o:ssl.enable=false --o:ssl.termination=true{{ if .Values.collabora.publicUrl }}
                --o:net.post_allow.host[0]={{ (urlParse .Values.collabora.publicUrl).host | replace "." "\\." }}{{ end }}
            - name: DONT_GEN_SSL_CERT
              value: "true"
            {{- if .Values.collabora.publicUrl }}
            - name: server_name
              value: {{ (urlParse .Values.collabora.publicUrl).host | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 9980
          readinessProbe:
            httpGet:
              path: /hosting/discovery
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            {{- toYaml .Values.collabora.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud.collaboraHost" . }}
  namespace: {{ include "nextcloud.namespace" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: collabora
spec:
  selector:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: collabora
  ports:
    - name: http
      port: 9980
      targetPort: http
{{- end }}

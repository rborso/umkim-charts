apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nextcloud.secretName" . }}
  namespace: {{ include "nextcloud.namespace" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ include "nextcloud.postgresPassword" . | quote }}
  admin-password: {{ include "nextcloud.adminPassword" . | quote }}
  {{- if and .Values.auth.ldap.enabled (not .Values.auth.ldap.existingSecret) }}
  ldap-bind-password: {{ .Values.auth.ldap.bindPassword | quote }}
  {{- end }}

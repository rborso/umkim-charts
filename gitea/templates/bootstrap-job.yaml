{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  namespace: {{ include "gitea.namespace" . }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ .Values.bootstrap.hookDeletePolicy }}
spec:
  backoffLimit: {{ .Values.bootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.bootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: bootstrap
    spec:
      # Co-locate with the server pod, which holds the shared ReadWriteOnce data
      # volume. On a backend without PV node affinity (e.g. Longhorn) a
      # bootstrapping Job scheduled on another node deadlocks on the attach.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: gitea
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/component: server
              topologyKey: kubernetes.io/hostname
      restartPolicy: Never
      {{- $hostAliases := include "gitea.hostAliases" . }}
      {{- if trim $hostAliases }}
      hostAliases:
        {{- $hostAliases | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- if .Values.auth.oidc.enabled }}
      initContainers:
        - name: ca-bundle
          image: {{ .Values.bootstrap.image | default .Values.gitea.image | quote }}
          imagePullPolicy: {{ .Values.gitea.imagePullPolicy }}
          command: ["/bin/sh", "-ec", "if [ -f /etc/ssl/umkim-thin/ca.crt ]; then cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/umkim-thin/ca.crt > /etc/ssl/combined/ca.crt; else cp /etc/ssl/certs/ca-certificates.crt /etc/ssl/combined/ca.crt; fi"]
          volumeMounts:
            - name: umkim-thin-ca
              mountPath: /etc/ssl/umkim-thin
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined
      {{- end }}
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | default .Values.gitea.image | quote }}
          imagePullPolicy: {{ .Values.gitea.imagePullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              echo "==> waiting for the database and running migrations"
              ok=""
              for i in $(seq 1 120); do
                if gitea migrate >/dev/null 2>&1; then ok=1; break; fi
                sleep 5
              done
              [ -n "${ok}" ] || { echo "gitea migrate failed after retries" >&2; exit 1; }

              echo "==> admin user ${ADMIN_USERNAME}"
              if out="$(gitea admin user create --admin --username "${ADMIN_USERNAME}" \
                    --password "${ADMIN_PASSWORD}" --email "${ADMIN_EMAIL}" \
                    --must-change-password=false 2>&1)"; then
                echo "admin created"
              else
                echo "${out}"
              fi
              gitea admin user change-password --username "${ADMIN_USERNAME}" \
                --password "${ADMIN_PASSWORD}" --must-change-password=false >/dev/null 2>&1 || true

              if [ "${LDAP_ENABLED:-false}" = "true" ]; then
                echo "==> LDAP auth source ${LDAP_NAME} -> ${LDAP_HOST}:${LDAP_PORT}"
                set -- --name "${LDAP_NAME}" --active --host "${LDAP_HOST}" --port "${LDAP_PORT}" \
                  --security-protocol "${LDAP_SECURITY_PROTOCOL}" \
                  --bind-dn "${LDAP_BIND_DN}" --bind-password "${LDAP_BIND_PASSWORD}" \
                  --user-search-base "${LDAP_USER_BASE}" --user-filter "${LDAP_USER_FILTER}" \
                  --username-attribute "${LDAP_USERNAME_ATTRIBUTE}" \
                  --email-attribute "${LDAP_EMAIL_ATTRIBUTE}"
                [ -n "${LDAP_FIRSTNAME_ATTRIBUTE}" ] && set -- "$@" --firstname-attribute "${LDAP_FIRSTNAME_ATTRIBUTE}"
                [ -n "${LDAP_SURNAME_ATTRIBUTE}" ] && set -- "$@" --surname-attribute "${LDAP_SURNAME_ATTRIBUTE}"
                [ -n "${LDAP_ADMIN_FILTER}" ] && set -- "$@" --admin-filter "${LDAP_ADMIN_FILTER}"
                [ -n "${LDAP_PUBLIC_SSH_KEY_ATTRIBUTE}" ] && set -- "$@" --public-ssh-key-attribute "${LDAP_PUBLIC_SSH_KEY_ATTRIBUTE}"
                [ "${LDAP_SSH_KEYS_ARE_VERIFIED}" = "true" ] && set -- "$@" --ssh-keys-are-verified
                [ "${LDAP_SKIP_TLS_VERIFY}" = "true" ] && set -- "$@" --skip-tls-verify
                [ "${LDAP_ALLOW_DEACTIVATE_ALL}" = "true" ] && set -- "$@" --allow-deactivate-all
                # Update the existing source so changed settings apply, else add it.
                existing_id="$(gitea admin auth list 2>/dev/null | awk -v n="${LDAP_NAME}" '{for(i=1;i<=NF;i++) if($i==n){print $1; exit}}')"
                if [ -n "${existing_id}" ]; then
                  gitea admin auth update-ldap --id "${existing_id}" "$@"
                  echo "auth source ${existing_id} updated"
                else
                  gitea admin auth add-ldap "$@"
                  echo "auth source added"
                fi
              else
                echo "==> LDAP auth source skipped (disabled)"
              fi

              if [ "${OIDC_ENABLED:-false}" = "true" ]; then
                echo "==> OIDC auth source ${OIDC_NAME} -> ${OIDC_DISCOVERY_URL}"
                set -- --name "${OIDC_NAME}" --provider openidConnect \
                  --key "${OIDC_CLIENT_ID}" --secret "${OIDC_CLIENT_SECRET}" \
                  --auto-discover-url "${OIDC_DISCOVERY_URL}" --scopes "${OIDC_SCOPES}"
                existing_id="$(gitea admin auth list 2>/dev/null | awk -v n="${OIDC_NAME}" '{for(i=1;i<=NF;i++) if($i==n){print $1; exit}}')"
                if [ -n "${existing_id}" ]; then
                  gitea admin auth update-oauth --id "${existing_id}" "$@" ||
                    echo "WARN: OIDC source ${existing_id} could not be updated; LDAP still works" >&2
                  echo "auth source ${existing_id} updated"
                else
                  gitea admin auth add-oauth "$@" ||
                    echo "WARN: OIDC source could not be added; LDAP still works" >&2
                  echo "auth source added"
                fi
              else
                echo "==> OIDC auth source skipped (disabled)"
              fi

              echo "==> bootstrap complete"
          env:
            - name: TZ
              value: {{ .Values.gitea.timezone | quote }}
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              value: {{ printf "%s-postgres:5432" .Release.Name | quote }}
            - name: GITEA__database__NAME
              value: {{ .Values.postgres.database | quote }}
            - name: GITEA__database__USER
              value: {{ .Values.postgres.username | quote }}
            - name: GITEA__database__SSL_MODE
              value: "disable"
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitea.secretName" . }}
                  key: postgres-password
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: ADMIN_USERNAME
              value: {{ .Values.bootstrap.admin.username | quote }}
            - name: ADMIN_EMAIL
              value: {{ include "gitea.adminEmail" . | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitea.secretName" . }}
                  key: admin-password
            - name: LDAP_ENABLED
              value: {{ .Values.auth.ldap.enabled | quote }}
            - name: LDAP_NAME
              value: {{ .Values.auth.ldap.name | quote }}
            - name: LDAP_HOST
              value: {{ .Values.auth.ldap.host | quote }}
            - name: LDAP_PORT
              value: {{ .Values.auth.ldap.port | quote }}
            - name: LDAP_SECURITY_PROTOCOL
              value: {{ .Values.auth.ldap.securityProtocol | quote }}
            - name: LDAP_SKIP_TLS_VERIFY
              value: {{ .Values.auth.ldap.skipTlsVerify | quote }}
            - name: LDAP_BIND_DN
              value: {{ .Values.auth.ldap.bindDn | quote }}
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitea.ldapSecretName" . }}
                  key: {{ include "gitea.ldapSecretKey" . }}
                  # Absent when LDAP is disabled; the script only reads it when
                  # LDAP_ENABLED=true, so do not block the Job on a missing key.
                  optional: true
            - name: LDAP_USER_BASE
              value: {{ .Values.auth.ldap.userSearchBase | quote }}
            - name: LDAP_USER_FILTER
              value: {{ .Values.auth.ldap.userFilter | quote }}
            - name: LDAP_ADMIN_FILTER
              value: {{ .Values.auth.ldap.adminFilter | quote }}
            - name: LDAP_ALLOW_DEACTIVATE_ALL
              value: {{ .Values.auth.ldap.allowDeactivateAll | quote }}
            - name: LDAP_USERNAME_ATTRIBUTE
              value: {{ .Values.auth.ldap.usernameAttribute | quote }}
            - name: LDAP_FIRSTNAME_ATTRIBUTE
              value: {{ .Values.auth.ldap.firstnameAttribute | quote }}
            - name: LDAP_SURNAME_ATTRIBUTE
              value: {{ .Values.auth.ldap.surnameAttribute | quote }}
            - name: LDAP_EMAIL_ATTRIBUTE
              value: {{ .Values.auth.ldap.emailAttribute | quote }}
            - name: LDAP_PUBLIC_SSH_KEY_ATTRIBUTE
              value: {{ .Values.auth.ldap.publicSshKeyAttribute | default "" | quote }}
            - name: LDAP_SSH_KEYS_ARE_VERIFIED
              value: {{ .Values.auth.ldap.sshKeysAreVerified | default false | quote }}
            - name: OIDC_ENABLED
              value: {{ .Values.auth.oidc.enabled | quote }}
            - name: OIDC_NAME
              value: {{ .Values.auth.oidc.name | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              value: {{ .Values.auth.oidc.clientSecret | quote }}
            - name: OIDC_DISCOVERY_URL
              value: {{ .Values.auth.oidc.discoveryUrl | quote }}
            - name: OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            {{- if .Values.auth.oidc.enabled }}
            - name: SSL_CERT_FILE
              value: /etc/ssl/combined/ca.crt
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.auth.oidc.enabled }}
            - name: umkim-thin-ca
              mountPath: /etc/ssl/umkim-thin
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if .Values.auth.oidc.enabled }}
        - name: umkim-thin-ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
        {{- end }}
{{- end }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ include "gitea.namespace" . }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.gitea.persistence.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.gitea.persistence.data.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitea.serverHost" . }}
  namespace: {{ include "gitea.namespace" . }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
    spec:
      securityContext:
        fsGroup: 1000
{{- $hostAliases := include "gitea.hostAliases" . -}}
{{- if trim $hostAliases }}
      hostAliases:
        {{- $hostAliases | nindent 8 }}
{{- end }}
      {{- if .Values.auth.oidc.enabled }}
      initContainers:
        - name: ca-bundle
          image: {{ .Values.gitea.image | quote }}
          imagePullPolicy: {{ .Values.gitea.imagePullPolicy }}
          command: ["/bin/sh", "-ec", "if [ -f /etc/ssl/umkim-thin/ca.crt ]; then cat /etc/ssl/certs/ca-certificates.crt /etc/ssl/umkim-thin/ca.crt > /etc/ssl/combined/ca.crt; else cp /etc/ssl/certs/ca-certificates.crt /etc/ssl/combined/ca.crt; fi"]
          volumeMounts:
            - name: umkim-thin-ca
              mountPath: /etc/ssl/umkim-thin
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined
      {{- end }}
      containers:
        - name: gitea
          image: {{ .Values.gitea.image | quote }}
          imagePullPolicy: {{ .Values.gitea.imagePullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.gitea.timezone | quote }}
            - name: GITEA__database__DB_TYPE
              value: "postgres"
            - name: GITEA__database__HOST
              value: {{ printf "%s-postgres:5432" .Release.Name | quote }}
            - name: GITEA__database__NAME
              value: {{ .Values.postgres.database | quote }}
            - name: GITEA__database__USER
              value: {{ .Values.postgres.username | quote }}
            - name: GITEA__database__SSL_MODE
              value: "disable"
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitea.secretName" . }}
                  key: postgres-password
            - name: GITEA__server__PROTOCOL
              value: "http"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__DOMAIN
              value: {{ include "gitea.publicHost" . | quote }}
            - name: GITEA__server__ROOT_URL
              value: {{ include "gitea.externalUrl" . | quote }}
            - name: GITEA__server__START_SSH_SERVER
              value: {{ .Values.gitea.ssh.enabled | quote }}
            - name: GITEA__server__SSH_LISTEN_PORT
              value: {{ .Values.gitea.ssh.listenPort | default 2222 | quote }}
            - name: GITEA__server__SSH_PORT
              value: {{ include "gitea.sshAdvertisedPort" . | quote }}
            - name: GITEA__server__SSH_DOMAIN
              value: {{ .Values.gitea.ssh.domain | default (include "gitea.publicHost" .) | quote }}
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__service__DISABLE_REGISTRATION
              value: {{ .Values.gitea.disableRegistration | quote }}
            - name: GITEA__service__ENABLE_AUTO_REGISTRATION
              value: {{ .Values.gitea.autoRegistration | default true | quote }}
            - name: GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION
              value: "true"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: {{ .Values.gitea.requireSigninView | default true | quote }}
            - name: GITEA__service__DEFAULT_USER_IS_RESTRICTED
              value: {{ .Values.gitea.defaultUserIsRestricted | default false | quote }}
            - name: GITEA__service__MAX_CREATION_LIMIT
              value: {{ .Values.gitea.maxCreationLimit | default 10 | quote }}
            - name: GITEA__repository__DEFAULT_BRANCH
              value: "main"
            {{- if .Values.auth.oidc.enabled }}
            # Go's TLS client uses SSL_CERT_FILE; the combined bundle carries
            # both the image's public roots and the platform CA.
            - name: SSL_CERT_FILE
              value: /etc/ssl/combined/ca.crt
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: GITEA__cache__ENABLED
              value: "true"
            - name: GITEA__cache__ADAPTER
              value: "redis"
            - name: GITEA__cache__HOST
              value: {{ printf "redis://%s-redis:6379/0" .Release.Name | quote }}
            - name: GITEA__session__PROVIDER
              value: "redis"
            - name: GITEA__session__PROVIDER_CONFIG
              value: {{ printf "redis://%s-redis:6379/0" .Release.Name | quote }}
            - name: GITEA__queue__TYPE
              value: "redis"
            - name: GITEA__queue__CONN_STR
              value: {{ printf "redis://%s-redis:6379/0" .Release.Name | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
            {{- if .Values.gitea.ssh.enabled }}
            - name: ssh
              containerPort: {{ .Values.gitea.ssh.listenPort | default 2222 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.auth.oidc.enabled }}
            - name: umkim-thin-ca
              mountPath: /etc/ssl/umkim-thin
              readOnly: true
            - name: combined-ca
              mountPath: /etc/ssl/combined
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gitea.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if .Values.auth.oidc.enabled }}
        - name: umkim-thin-ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitea.serverHost" . }}
  namespace: {{ include "gitea.namespace" . }}
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.gitea.ssh.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 3000
      targetPort: http
    {{- if .Values.gitea.ssh.enabled }}
    - name: ssh
      port: {{ .Values.gitea.ssh.listenPort | default 2222 }}
      targetPort: ssh
      {{- if and (eq (.Values.gitea.ssh.service.type | default "ClusterIP") "NodePort") (gt (int (.Values.gitea.ssh.service.nodePort | default 0)) 0) }}
      nodePort: {{ .Values.gitea.ssh.service.nodePort }}
      {{- end }}
    {{- end }}

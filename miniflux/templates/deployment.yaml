apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: miniflux
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The upstream image declares USER 65534 (nobody), so pin that rather than
        # a guess: anything else either fails the runAsNonRoot check or cannot
        # write /tmp. Miniflux keeps all state in PostgreSQL and writes nothing
        # else, so no data volume or fsGroup is needed.
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: ca-bundle
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cat /etc/ssl/certs/ca-certificates.crt > /etc/ssl/combined/ca.crt
              if [ -f /etc/ssl/umkim-thin/ca.crt ]; then
                cat /etc/ssl/umkim-thin/ca.crt >> /etc/ssl/combined/ca.crt
              fi
          volumeMounts:
            - { name: ca, mountPath: /etc/ssl/umkim-thin, readOnly: true }
            - { name: combined-ca, mountPath: /etc/ssl/combined }
        # Miniflux runs its migrations at startup, so the database must be
        # accepting connections first; otherwise the first boot crash-loops until
        # PostgreSQL wins the race.
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.postgres.imagePullPolicy }}
          # This runs the PostgreSQL image, which has its own user (999), so it
          # must not inherit the pod's 65534.
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              i=0
              while [ "$i" -lt 60 ]; do
                if pg_isready -h {{ .Release.Name }}-postgres -p 5432 -U "$POSTGRES_USER" >/dev/null 2>&1; then exit 0; fi
                i=$((i+1)); sleep 2
              done
              echo "PostgreSQL did not become ready within 120s" >&2
              exit 1
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: postgres-password
        {{- if .Values.oidc.enabled }}
        # Miniflux reads the discovery document at startup; on a fresh install the
        # identity stack can still be settling, so wait (bounded) rather than
        # initialise with a dead issuer.
        - name: wait-for-oidc
          image: {{ .Values.oidc.waitImage | default "curlimages/curl:8.11.1" | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              url="{{ trimSuffix "/" .Values.oidc.issuerUrl }}/.well-known/openid-configuration"
              i=0
              while [ "$i" -lt 60 ]; do
                if curl -fsS -o /dev/null --max-time 5 "$url"; then exit 0; fi
                i=$((i+1)); sleep 2
              done
              echo "OIDC discovery did not answer within 120s; starting anyway" >&2
              exit 0
        {{- end }}
      containers:
        - name: miniflux
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.port }}"
            - name: BASE_URL
              value: {{ trimSuffix "/" .Values.externalUrl | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Cookies must be marked secure: the app is only reachable over TLS
            # through Traefik.
            - name: HTTPS
              value: "1"
            - name: DISABLE_HSTS
              value: "1"
            - name: RUN_MIGRATIONS
              value: "1"
            - name: DISABLE_LOCAL_AUTH
              value: {{ .Values.disableLocalAuth | quote }}
            {{- if .Values.allowPrivateNetworks }}
            - name: FETCHER_ALLOW_PRIVATE_NETWORKS
              value: "1"
            {{- end }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: postgres-password
            # $(POSTGRES_PASSWORD) expands because that variable is declared above;
            # Kubernetes only substitutes variables defined earlier in this list.
            - name: DATABASE_URL
              value: "host={{ .Release.Name }}-postgres port=5432 user={{ .Values.postgres.username }} dbname={{ .Values.postgres.database }} sslmode=disable password=$(POSTGRES_PASSWORD)"
            - name: ADMIN_USERNAME
              value: {{ .Values.bootstrap.adminUsername | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: admin-password
            # Miniflux creates this account only when the database has no users at
            # all, so leaving it enabled is idempotent: a restart or upgrade with
            # users already present does nothing, and the password comes from the
            # kept Secret rather than being reset.
            - name: CREATE_ADMIN
              value: "1"
            {{- if .Values.oidc.enabled }}
            - name: OAUTH2_PROVIDER
              value: "oidc"
            - name: OAUTH2_OIDC_DISCOVERY_ENDPOINT
              value: {{ trimSuffix "/" .Values.oidc.issuerUrl | quote }}
            - name: OAUTH2_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: oidc-client-secret
            - name: OAUTH2_REDIRECT_URL
              value: {{ .Values.oidc.redirectUrl | quote }}
            - name: OAUTH2_OIDC_PROVIDER_NAME
              value: {{ .Values.oidc.providerName | quote }}
            - name: OAUTH2_USER_CREATION
              value: {{ ternary "1" "0" .Values.oidc.userCreation | quote }}
            {{- end }}
            # Miniflux writes nothing to disk beyond the temp dir, but Go needs a
            # writable /tmp for some readers.
            - name: TMPDIR
              value: /tmp
            - name: SSL_CERT_FILE
              value: /etc/ssl/combined/ca.crt
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: combined-ca, mountPath: /etc/ssl/combined, readOnly: true }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: miniflux
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: miniflux
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http

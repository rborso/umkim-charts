namespaceOverride: ""

# Pinned digestless tags are avoided elsewhere in this repo; Miniflux publishes
# per-release tags, so pin the exact version and let the mirror cache it.
image: docker.io/miniflux/miniflux:2.3.5
imagePullPolicy: IfNotPresent
timezone: "UTC"

# Public URL, e.g. https://miniflux.example.com. UMKIM fills this from the route.
externalUrl: ""
# UMKIM sets this so the app reaches its public host and the portal through
# Traefik, even when the cluster cannot hairpin to the public address.
hostAliases: []

port: 8080
logLevel: info

# Local password login stays available as breakglass alongside directory SSO,
# which is what the other apps in this catalog do as well.
disableLocalAuth: false
# Miniflux refuses private/loopback fetch targets by default. Feeds on the
# public internet do not need it, so leave it off; an operator who feeds an
# internal address can turn it on here.
allowPrivateNetworks: false

persistence:
  # Miniflux keeps everything in PostgreSQL; it has no data directory of its own.
  storageClass: ""

postgres:
  image: docker.io/library/postgres:18.6
  imagePullPolicy: IfNotPresent
  database: miniflux
  username: miniflux
  # Empty generates a random password on install (stored in the release Secret).
  password: ""
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 256Mi }

# The first admin. Miniflux creates it only when CREATE_ADMIN=1 (the bootstrap
# Job sets that on first run), and the account stays available as breakglass
# alongside directory SSO.
bootstrap:
  enabled: true
  adminUsername: "miniflux-admin"
  # Empty generates a random password on install (stored in the release Secret).
  adminPassword: ""

oidc:
  enabled: false
  # Discovery endpoint without the /.well-known/... suffix; Miniflux appends it.
  issuerUrl: ""
  clientId: ""
  clientSecret: ""
  providerName: "Directory"
  redirectUrl: ""
  # Create a user on first SSO login so an invited tenant needs no local account.
  userCreation: true
  # Unused by Miniflux directly; kept so the shared OIDC plumbing has a home.
  scope: "openid profile email"
  waitImage: "curlimages/curl:8.11.1"

{{- if .Values.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sparkyfitness-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: {{ .Values.bootstrap.hookDeletePolicy }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparkyfitness-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache curl jq >/dev/null 2>&1
              BASE="http://{{ .Release.Name }}:{{ .Values.frontend.port }}"
              echo "==> waiting for SparkyFitness"
              for i in $(seq 1 120); do
                if curl -fsS "${BASE}/api/health" >/dev/null 2>&1; then break; fi
                sleep 5
              done
              curl -fsS "${BASE}/api/health" >/dev/null

              {{- if .Values.oidc.enabled }}
              settings=$(curl -fsS "${BASE}/api/auth/settings")
              printf '%s' "$settings" | jq -e --arg slug {{ .Values.oidc.providerSlug | quote }} \
                '.oidc.providers[]?.id == $slug' >/dev/null || {
                echo "OIDC provider {{ .Values.oidc.providerSlug }} is not registered yet" >&2
                printf '%s\n' "$settings" >&2
                exit 1
              }
              echo "==> OIDC provider {{ .Values.oidc.providerSlug }} is registered"
              {{- end }}

              {{- if and .Values.integrations.mealie.enabled .Values.integrations.mealie.baseUrl }}
              MEALIE={{ trimSuffix "/" .Values.integrations.mealie.baseUrl | quote }}
              for i in $(seq 1 60); do
                if curl -fsS "${MEALIE}/api/app/about/startup-info" >/dev/null 2>&1; then break; fi
                sleep 5
              done
              curl -fsS "${MEALIE}/api/app/about/startup-info" >/dev/null
              echo "==> Mealie is reachable at ${MEALIE}; add it as a provider in SparkyFitness"
              {{- end }}

              echo "==> SparkyFitness is healthy"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
{{- end }}

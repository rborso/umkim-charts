{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingData := ($existing).data | default dict -}}
{{- $pg := .Values.postgres.password -}}
{{- if and (not $pg) (index $existingData "postgres-password") -}}
{{- $pg = index $existingData "postgres-password" | b64dec -}}
{{- end -}}
{{- if not $pg -}}{{- $pg = randAlphaNum 32 -}}{{- end -}}
{{- $appdb := "" -}}
{{- if index $existingData "app-db-password" -}}
{{- $appdb = index $existingData "app-db-password" | b64dec -}}
{{- end -}}
{{- if not $appdb -}}{{- $appdb = randAlphaNum 32 -}}{{- end -}}
{{- $apiKey := "" -}}
{{- if index $existingData "api-encryption-key" -}}
{{- $apiKey = index $existingData "api-encryption-key" | b64dec -}}
{{- end -}}
{{- if not $apiKey -}}{{- $apiKey = randAlphaNum 64 | sha256sum -}}{{- end -}}
{{- $authSecret := "" -}}
{{- if index $existingData "better-auth-secret" -}}
{{- $authSecret = index $existingData "better-auth-secret" | b64dec -}}
{{- end -}}
{{- if not $authSecret -}}{{- $authSecret = randAlphaNum 48 | b64enc -}}{{- end -}}
{{- $oidc := .Values.oidc.clientSecret -}}
{{- if and (not $oidc) (index $existingData "oidc-client-secret") -}}
{{- $oidc = index $existingData "oidc-client-secret" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sparkyfitness
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  postgres-password: {{ $pg | quote }}
  app-db-password: {{ $appdb | quote }}
  api-encryption-key: {{ $apiKey | quote }}
  better-auth-secret: {{ $authSecret | quote }}
  oidc-client-secret: {{ $oidc | quote }}

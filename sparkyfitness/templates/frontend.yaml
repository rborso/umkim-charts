apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sparkyfitness
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sparkyfitness
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sparkyfitness
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # nginx in the image listens on port 80; the file capability is
              # stripped by NoNewPrivs, so grant it through the pod spec.
              add: [NET_BIND_SERVICE]
          ports:
            - { name: http, containerPort: {{ .Values.frontend.port }} }
          env:
            - name: SPARKY_FITNESS_FRONTEND_URL
              value: {{ .Values.externalUrl | quote }}
            - name: SPARKY_FITNESS_SERVER_HOST
              value: {{ printf "%s-server.%s.svc.cluster.local" .Release.Name .Release.Namespace | quote }}
            - name: SPARKY_FITNESS_SERVER_PORT
              value: {{ .Values.server.port | quote }}
            - name: NGINX_LISTEN_PORT
              value: {{ .Values.frontend.port | quote }}
            - name: NGINX_RATE_LIMIT
              value: {{ .Values.frontend.rateLimit | quote }}
            - name: PUID
              value: "101"
            - name: GUID
              value: "101"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /run }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sparkyfitness
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: sparkyfitness
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http

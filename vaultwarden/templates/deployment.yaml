apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: ca-bundle
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cat /etc/ssl/certs/ca-certificates.crt > /etc/ssl/combined/ca.crt
              if [ -f /etc/ssl/umkim-thin/ca.crt ]; then
                cat /etc/ssl/umkim-thin/ca.crt >> /etc/ssl/combined/ca.crt
              fi
          volumeMounts:
            - { name: ca, mountPath: /etc/ssl/umkim-thin, readOnly: true }
            - { name: combined-ca, mountPath: /etc/ssl/combined }
      containers:
        - name: vaultwarden
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          env:
            - name: ROCKET_PORT
              value: {{ .Values.port | quote }}
            - name: ROCKET_ADDRESS
              value: "0.0.0.0"
            - name: DATA_FOLDER
              value: "/data"
            - name: WEB_VAULT_ENABLED
              value: "true"
            - name: DOMAIN
              value: {{ .Values.externalUrl | quote }}
            - name: SIGNUPS_ALLOWED
              value: {{ .Values.signupsAllowed | quote }}
            - name: SIGNUPS_VERIFY
              value: {{ .Values.signupsVerify | quote }}
            - name: INVITATIONS_ALLOWED
              value: {{ .Values.invitationsAllowed | quote }}
            - name: SHOW_PASSWORD_HINT
              value: {{ .Values.showPasswordHint | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: SSL_CERT_FILE
              value: "/etc/ssl/combined/ca.crt"
            - name: SSL_CERT_DIR
              value: "/etc/ssl/combined"
            - name: IP_HEADER
              value: "X-Forwarded-For"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: admin-token
            {{- if .Values.sso.enabled }}
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: {{ .Values.sso.only | quote }}
            - name: SSO_AUTHORITY
              value: {{ .Values.sso.authority | quote }}
            - name: SSO_CLIENT_ID
              value: {{ .Values.sso.clientId | quote }}
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: sso-client-secret
            - name: SSO_SCOPES
              value: {{ .Values.sso.scopes | quote }}
            - name: SSO_PKCE
              value: {{ .Values.sso.pkce | quote }}
            - name: SSO_SIGNUPS_ALLOWED
              value: {{ .Values.sso.signupsAllowed | quote }}
            - name: SSO_SIGNUPS_MATCH_EMAIL
              value: {{ .Values.sso.matchEmail | quote }}
            - name: SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION
              value: {{ .Values.sso.allowUnknownEmailVerification | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: combined-ca, mountPath: /etc/ssl/combined, readOnly: true }
            # rustls-platform-verifier reads the system bundle path; replace it
            # with the combined public + platform CA file for SSO discovery.
            - { name: combined-ca, mountPath: /etc/ssl/certs/ca-certificates.crt, subPath: ca.crt, readOnly: true }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: tmp
          emptyDir: {}
        - name: ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http

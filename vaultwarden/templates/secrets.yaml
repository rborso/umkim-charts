{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingData := ($existing).data | default dict -}}
{{- $admin := .Values.adminToken -}}
{{- if and (not $admin) (index $existingData "admin-token") -}}
{{- $admin = index $existingData "admin-token" | b64dec -}}
{{- end -}}
{{- if not $admin -}}{{- $admin = randAlphaNum 48 -}}{{- end -}}
{{- $sso := .Values.sso.clientSecret -}}
{{- if and (not $sso) (index $existingData "sso-client-secret") -}}
{{- $sso = index $existingData "sso-client-secret" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vaultwarden
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  admin-token: {{ $admin | quote }}
  sso-client-secret: {{ $sso | quote }}

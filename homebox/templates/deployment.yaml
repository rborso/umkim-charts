{{- $hostname := .Values.hostname | default (trimSuffix "/" .Values.externalUrl | trimPrefix "https://" | trimPrefix "http://") -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.data.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: homebox
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homebox
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homebox
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: ca-bundle
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cat /etc/ssl/certs/ca-certificates.crt > /etc/ssl/combined/ca.crt
              if [ -f /etc/ssl/umkim-thin/ca.crt ]; then
                cat /etc/ssl/umkim-thin/ca.crt >> /etc/ssl/combined/ca.crt
              fi
          volumeMounts:
            - { name: ca, mountPath: /etc/ssl/umkim-thin, readOnly: true }
            - { name: combined-ca, mountPath: /etc/ssl/combined }
      containers:
        - name: homebox
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - { name: http, containerPort: {{ .Values.port }} }
          env:
            - name: HBOX_MODE
              value: "production"
            - name: HBOX_WEB_PORT
              value: {{ .Values.port | quote }}
            - name: HBOX_WEB_HOST
              value: "0.0.0.0"
            - name: HBOX_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: HBOX_OPTIONS_ALLOW_ANALYTICS
              value: "false"
            - name: HBOX_OPTIONS_ALLOW_REGISTRATION
              value: {{ .Values.allowRegistration | quote }}
            - name: HBOX_OPTIONS_ALLOW_LOCAL_LOGIN
              value: {{ .Values.allowLocalLogin | quote }}
            - name: HBOX_OPTIONS_TRUST_PROXY
              value: "true"
            - name: HBOX_OPTIONS_GITHUB_RELEASE_CHECK
              value: "false"
            - name: HBOX_OPTIONS_HOSTNAME
              value: {{ $hostname | quote }}
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: api-key-pepper
            - name: HBOX_STORAGE_CONN_STRING
              value: "file:///?no_tmp_dir=true"
            - name: HBOX_STORAGE_PREFIX_PATH
              value: "data"
            - name: HBOX_DATABASE_SQLITE_PATH
              value: "/data/homebox.db?_pragma=busy_timeout=2000&_pragma=journal_mode=WAL&_fk=1&_time_format=sqlite"
            - name: SSL_CERT_FILE
              value: "/etc/ssl/combined/ca.crt"
            {{- if .Values.oidc.enabled }}
            - name: HBOX_OIDC_ENABLED
              value: "true"
            - name: HBOX_OIDC_ISSUER_URL
              value: {{ trimSuffix "/" .Values.oidc.issuerUrl | quote }}
            - name: HBOX_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: HBOX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: oidc-client-secret
            - name: HBOX_OIDC_SCOPE
              value: {{ .Values.oidc.scope | quote }}
            - name: HBOX_OIDC_AUTO_REDIRECT
              value: {{ .Values.oidc.autoRedirect | quote }}
            - name: HBOX_OIDC_VERIFY_EMAIL
              value: {{ .Values.oidc.verifyEmail | quote }}
            - name: HBOX_OIDC_BUTTON_TEXT
              value: {{ .Values.oidc.buttonText | quote }}
            {{- with .Values.oidc.allowedGroups }}
            - name: HBOX_OIDC_ALLOWED_GROUPS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: combined-ca, mountPath: /etc/ssl/combined, readOnly: true }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: tmp
          emptyDir: {}
        - name: ca
          configMap:
            name: umkim-thin-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: homebox
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: homebox
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http

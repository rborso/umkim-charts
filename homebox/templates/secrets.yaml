{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingData := ($existing).data | default dict -}}
{{- $pepper := "" -}}
{{- if index $existingData "api-key-pepper" -}}
{{- $pepper = index $existingData "api-key-pepper" | b64dec -}}
{{- end -}}
{{- if not $pepper -}}{{- $pepper = randAlphaNum 48 -}}{{- end -}}
{{- $oidc := .Values.oidc.clientSecret -}}
{{- if and (not $oidc) (index $existingData "oidc-client-secret") -}}
{{- $oidc = index $existingData "oidc-client-secret" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: homebox
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  api-key-pepper: {{ $pepper | quote }}
  oidc-client-secret: {{ $oidc | quote }}

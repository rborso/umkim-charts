{{- if and .Values.webui.enabled .Values.webui.apiKeys.enabled }}
{{- /*
Per-user API keys need one thing the environment cannot deliver on an install that
has already booted: `user.permissions.features.api_keys`, which lets a NON-ADMIN
mint a key. The admin works without it, which is how the 403 on ordinary users
gets missed.

This Job applies it through the admin API - the same call the Permissions
checkbox makes. The *other* half (`auth.enable_api_keys`, the switch the create
route checks first) is a config row that wins over the environment for ever once
stored, so it is cleared by an init container on the webui pod itself, before the
app starts. See templates/webui.yaml.

Idempotent: reads the permission tree, writes only when the flag is off, exits 0
either way.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-webui-apikeys
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ai-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-webui
          image: docker.io/library/alpine:3.22.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: ["/bin/sh", "-ec"]
          args:
            - |
              i=0
              while [ "$i" -lt 90 ]; do
                if nc -z {{ .Release.Name }}-webui 8080 2>/dev/null; then exit 0; fi
                i=$((i+1)); sleep 2
              done
              echo "open webui did not answer within 180s" >&2
              exit 1
      containers:
        - name: enable-api-keys
          # Open WebUI's own image: python3 plus its sqlite module, and it can
          # read the database it owns.
          image: {{ .Values.webui.image | quote }}
          imagePullPolicy: {{ .Values.webui.imagePullPolicy }}
          command: ["python3", "-c"]
          args:
            - |
              import json, os, ssl, sys, time, urllib.request

              BASE = "http://{{ .Release.Name }}-webui:8080"
              EMAIL = {{ .Values.webui.admin.email | quote }}
              PASSWORD = os.environ["WEBUI_ADMIN_PASSWORD"]

              def call(path, data=None, token=None, method=None):
                  body = json.dumps(data).encode() if data is not None else None
                  req = urllib.request.Request(BASE + path, data=body, method=method)
                  req.add_header("Content-Type", "application/json")
                  if token:
                      req.add_header("Authorization", "Bearer " + token)
                  with urllib.request.urlopen(req, timeout=30,
                                              context=ssl.create_default_context()) as r:
                      return r.status, json.loads(r.read() or b"{}")

              token = ""
              for attempt in range(30):
                  try:
                      status, body = call("/api/v1/auths/signin",
                                          {"email": EMAIL, "password": PASSWORD})
                      if status == 200 and body.get("token"):
                          token = body["token"]
                          break
                      print("signin -> %s (attempt %d)" % (status, attempt + 1))
                  except Exception as exc:
                      print("signin not ready (attempt %d): %s" % (attempt + 1, exc))
                  time.sleep(10)

              if not token:
                  print("could not sign in as the seeded admin; is webui.admin.email set?",
                        file=sys.stderr)
                  sys.exit(1)

              status, perms = call("/api/v1/users/default/permissions", token=token)
              features = perms.setdefault("features", {})
              if features.get("api_keys") is True:
                  print("features.api_keys is already enabled; nothing to do")
                  sys.exit(0)

              features["api_keys"] = True
              status, _ = call("/api/v1/users/default/permissions", perms,
                               token=token, method="POST")
              if status != 200:
                  print("permission update -> %s" % status, file=sys.stderr)
                  sys.exit(1)
              print("enabled per-user API keys (features.api_keys)")
          env:
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: admin-password
{{- end }}

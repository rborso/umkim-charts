{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name) -}}
{{- $data := dig "data" dict $existing -}}
{{- $webui := dig "webui-secret" "" $data | b64dec -}}
{{- if not $webui -}}{{- $webui = randAlphaNum 48 -}}{{- end -}}
{{- $master := .Values.litellm.masterKey -}}
{{- if and (not $master) (dig "master-key" "" $data) -}}
{{- $master = dig "master-key" "" $data | b64dec -}}
{{- end -}}
{{- if not $master -}}{{- $master = printf "sk-%s" (randAlphaNum 32) -}}{{- end -}}
{{- $oidc := .Values.webui.oidc.clientSecret -}}
{{- if and (not $oidc) (dig "oidc-client-secret" "" $data) -}}
{{- $oidc = dig "oidc-client-secret" "" $data | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ai
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # Signs Open WebUI sessions. Regenerating it logs every user out, so it is kept.
  webui-secret: {{ $webui | quote }}
  # The gateway's own bearer key. Every client of LiteLLM presents this.
  master-key: {{ $master | quote }}
  oidc-client-secret: {{ $oidc | quote }}

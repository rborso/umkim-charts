{{- $name := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $db := .Values.database.password -}}
{{- if and (not $db) $existing (index ($existing.data | default dict) "database-password") -}}
{{- $db = index $existing.data "database-password" | b64dec -}}
{{- end -}}
{{- if not $db -}}{{- $db = randAlphaNum 32 -}}{{- end -}}
{{- $root := .Values.database.rootPassword -}}
{{- if and (not $root) $existing (index ($existing.data | default dict) "database-root-password") -}}
{{- $root = index $existing.data "database-root-password" | b64dec -}}
{{- end -}}
{{- if not $root -}}{{- $root = randAlphaNum 32 -}}{{- end -}}
{{- $admin := .Values.bootstrap.adminPassword -}}
{{- if and (not $admin) $existing (index ($existing.data | default dict) "admin-password") -}}
{{- $admin = index $existing.data "admin-password" | b64dec -}}
{{- end -}}
{{- if not $admin -}}{{- $admin = randAlphaNum 24 -}}{{- end -}}
{{- $oidc := .Values.oidc.clientSecret -}}
{{- if and (not $oidc) $existing (index ($existing.data | default dict) "oidc-client-secret") -}}
{{- $oidc = index $existing.data "oidc-client-secret" | b64dec -}}
{{- end -}}
{{- $key := .Values.appKey -}}
{{- if and (not $key) $existing (index ($existing.data | default dict) "app-key") -}}
{{- $key = index $existing.data "app-key" | b64dec -}}
{{- end -}}
{{- if not $key -}}{{- $key = printf "base64:%s" (randAlphaNum 32 | b64enc) -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  annotations:
    helm.sh/resource-policy: keep
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: bookstack
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  database-password: {{ $db | quote }}
  database-root-password: {{ $root | quote }}
  admin-password: {{ $admin | quote }}
  oidc-client-secret: {{ $oidc | quote }}
  # Laravel's APP_KEY encrypts sessions and cookies. Regenerating it on upgrade
  # would log everyone out, so it is generated once and kept like the rest.
  app-key: {{ $key | quote }}
